name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - name: Publish userscripts
        run: gh release create "$GITHUB_REF_NAME" dist/*.user.js --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the signed APKs
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.UNSCROLL_KEYSTORE_BASE64 }}
          UNSCROLL_KEYSTORE_PASSWORD: ${{ secrets.UNSCROLL_KEYSTORE_PASSWORD }}
          UNSCROLL_KEY_ALIAS: ${{ secrets.UNSCROLL_KEY_ALIAS }}
          UNSCROLL_KEY_PASSWORD: ${{ secrets.UNSCROLL_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "The UNSCROLL_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/unscroll.jks"
          export UNSCROLL_KEYSTORE_FILE="$RUNNER_TEMP/unscroll.jks"
          ./gradlew assembleOfflineRelease assembleOnlineRelease
      - name: Verify and name the APKs
        run: |
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          version=$(node -p "require('./package.json').version")
          mkdir -p dist-android
          for flavor in offline online; do
            apk="android/app/build/outputs/apk/$flavor/release/app-$flavor-release.apk"
            "$build_tools/apksigner" verify --print-certs "$apk"
            cp "$apk" "dist-android/unscroll-$version-$flavor.apk"
          done
          if "$build_tools/aapt2" dump permissions "dist-android/unscroll-$version-offline.apk" | grep -q "android.permission.INTERNET"; then
            echo "The offline APK asks for the INTERNET permission"
            exit 1
          fi
      - name: Attach the APKs to the release
        run: gh release upload "$GITHUB_REF_NAME" dist-android/*.apk
        env:
          GH_TOKEN: ${{ github.token }}
